<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>校园外卖 · 支付处理中 — P0</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar">
          <span>9:41</span>
          <div class="icons">
            <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="10" width="3" height="5" rx="0.5"/><rect x="5.5" y="7" width="3" height="8" rx="0.5"/><rect x="10" y="4" width="3" height="11" rx="0.5"/></svg>
            <svg viewBox="0 0 24 12" width="24" height="12" fill="currentColor"><rect x="0" y="1" width="20" height="10" rx="2" stroke="currentColor" fill="none" stroke-width="1.2"/><rect x="2" y="3" width="14" height="6" rx="1"/><rect x="21" y="3.5" width="2" height="5" rx="0.5"/></svg>
          </div>
        </div>

        <header class="app-header row">
          <div style="width:32px;"></div>
          <div style="flex:1;text-align:center;">
            <h1 style="font-size:16px;">收银台</h1>
            <p class="sub">一食堂·麻辣香锅 · ¥30</p>
          </div>
          <div style="width:32px;"></div>
        </header>

        <main class="content">
          <div class="pay-center">
            <div class="pay-spinner" aria-hidden="true"></div>
            <h2 class="pay-pulse">支付处理中</h2>
            <p class="pay-hint">请稍候，不要关闭页面</p>
            <p style="font-size:12px;color:var(--text-faint);">Demo：
              <a href="p0-pay-success.html" style="color:var(--primary);">成功</a>
              ·
              <a href="p0-pay-fail.html" style="color:var(--primary);">失败</a>
            </p>
          </div>
        </main>
      </div>
    </div>
  </div>

  <nav class="demo-nav" aria-label="Demo screens">
    <a href="p0-home.html">店列表</a>
    <a href="p0-empty-shops.html">空店</a>
    <a href="p0-menu.html">菜单</a>
    <a href="p0-empty-menu.html">空菜单</a>
    <a href="p0-confirm.html">确认单</a>
    <a href="p0-pay-processing.html" class="current">支付中</a>
    <a href="p0-pay-success.html">支付成功</a>
    <a href="p0-pay-fail.html">支付失败</a>
    <a href="p0-order.html">订单</a>
    <a href="p0-empty-orders.html">空订单</a>
    <a href="p0-merchant-verify.html">核销</a>
  </nav>
</body>
</html>
