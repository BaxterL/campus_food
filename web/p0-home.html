<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>校园外卖 · 店列表 — P0</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar">
          <span>9:41</span>
          <div class="icons">
            <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="10" width="3" height="5" rx="0.5"/><rect x="5.5" y="7" width="3" height="8" rx="0.5"/><rect x="10" y="4" width="3" height="11" rx="0.5"/></svg>
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3c2.5 0 4.7 1 6.3 2.6l-1.4 1.4A6.9 6.9 0 008 5a6.9 6.9 0 00-4.9 2L1.7 5.6A8.9 8.9 0 018 3zm0 4c1.4 0 2.6.5 3.5 1.4L10 9.9A3.9 3.9 0 008 9a3.9 3.9 0 00-2 .9L4.5 8.4A5.9 5.9 0 018 7zm0 4a2 2 0 011.4.6L8 13l-1.4-1.4A2 2 0 018 11z"/></svg>
            <svg viewBox="0 0 24 12" width="24" height="12" fill="currentColor"><rect x="0" y="1" width="20" height="10" rx="2" stroke="currentColor" fill="none" stroke-width="1.2"/><rect x="2" y="3" width="14" height="6" rx="1"/><rect x="21" y="3.5" width="2" height="5" rx="0.5"/></svg>
          </div>
        </div>

        <header class="app-header">
          <h1>校园外卖</h1>
          <p class="sub">自取 · 华东师范大学 · 中山北路校区</p>
          <div class="search-box" role="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <span>搜索店铺或菜品</span>
          </div>
        </header>

        <main class="content">
          <p class="section-label">附近可自取 · 3 家</p>

          <a class="card shop-card" href="p0-menu.html">
            <div class="shop-thumb" aria-hidden="true">🍲</div>
            <div class="shop-body">
              <div class="shop-name">一食堂·麻辣香锅</div>
              <div class="shop-meta">
                <span class="tag">自取</span>
                <span>10:00–20:30</span>
                <span class="meta-dot">起送 ¥15</span>
                <span class="meta-dot">步行 3 分钟</span>
              </div>
            </div>
          </a>

          <a class="card shop-card" href="p0-menu.html">
            <div class="shop-thumb" aria-hidden="true">🍗</div>
            <div class="shop-body">
              <div class="shop-name">校门口鸡公煲</div>
              <div class="shop-meta">
                <span class="tag">自取</span>
                <span>11:00–21:00</span>
                <span class="meta-dot">起送 ¥20</span>
                <span class="meta-dot">约 350m</span>
              </div>
            </div>
          </a>

          <a class="card shop-card" href="p0-menu.html">
            <div class="shop-thumb" aria-hidden="true">🍜</div>
            <div class="shop-body">
              <div class="shop-name">二食堂·兰州拉面</div>
              <div class="shop-meta">
                <span class="tag">自取</span>
                <span>07:00–19:30</span>
                <span class="meta-dot">起送 ¥12</span>
                <span class="meta-dot">步行 5 分钟</span>
              </div>
            </div>
          </a>
        </main>
      </div>
    </div>
  </div>

  <nav class="demo-nav" aria-label="Demo screens">
    <a href="p0-home.html" class="current">店列表</a>
    <a href="p0-empty-shops.html">空店</a>
    <a href="p0-menu.html">菜单</a>
    <a href="p0-empty-menu.html">空菜单</a>
    <a href="p0-confirm.html">确认单</a>
    <a href="p0-pay-processing.html">支付中</a>
    <a href="p0-pay-success.html">支付成功</a>
    <a href="p0-pay-fail.html">支付失败</a>
    <a href="p0-order.html">订单</a>
    <a href="p0-empty-orders.html">空订单</a>
    <a href="p0-merchant-verify.html">核销</a>
  </nav>
</body>
</html>
