packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  core-js: true
  core-js-pure: true
  esbuild: true
  prisma: true
  vue-demi: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - core-js
  - core-js-pure
  - esbuild
  - prisma
  - vue-demi

ignoredBuiltDependencies:
  - '@scarf/scarf'
