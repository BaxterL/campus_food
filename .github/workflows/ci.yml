name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: campus_food_test
          POSTGRES_USER: campus_food
          POSTGRES_PASSWORD: campus_food_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_food -d campus_food_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://campus_food:campus_food_test@localhost:5432/campus_food_test?schema=public
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      DEV_AUTH_ENABLED: "true"
      PAYMENT_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm check
