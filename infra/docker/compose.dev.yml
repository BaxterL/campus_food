services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campus_food
      POSTGRES_USER: campus_food
      POSTGRES_PASSWORD: campus_food_dev
    ports:
      - "5432:5432"
    volumes:
      - campus_food_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_food -d campus_food"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  campus_food_pg:
